<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="TrajecTiers: a trace exploration dashboard for the trajectories of LLM agents that repair bugs">
<title>Upload · TrajecTiers</title>
<link rel="icon" href="logo.svg" type="image/svg+xml">
<link rel="stylesheet" href="viewer.css?v=20261017e">
</head>
<body class="page-upload">
<header class="top">
  <a class="logo home" data-logo="26" href="index.html" aria-label="TrajecTiers: corpus"><span class="word">Trajec<b>Tiers</b></span></a>
  <nav class="nav" aria-label="Pages">
    <a href="index.html">Corpus</a>
    <a href="upload.html" aria-current="page">Upload</a>
    <a href="tables.html">Lookup tables</a>
  </nav>
  <div class="top-r">
    <button class="btn ghost lbl-opt" data-theme-btn type="button"></button>
  </div>
</header>

<main class="wrap upwrap" id="app">
  <div class="pagehead">
    <div>
      <h1 id="upTitle">Upload</h1>
      <p class="ph-sub">Logs stay in this browser.</p>
    </div>
  </div>
  <div class="status" id="status" role="status" aria-live="polite" hidden></div>

  <section class="card drop" id="drop">
    <span class="drop-i" aria-hidden="true">&#8679;</span>
    <div><b>Drop log files here</b> <span class="muted">or</span> <button class="btn primary small" type="button" id="pick">choose files</button></div>
    <span class="muted small">Claude Code · Codex · Qwen Code · SWE-agent · OpenHands · mini-swe-agent · ATIF</span>
    <input type="file" id="file" multiple hidden accept=".json,.jsonl,.ndjson,.log,.txt,.traj,application/json,text/plain">
  </section>

  <section class="card upcfg" id="cfg" hidden>
    <div class="relopts" id="kinds" role="radiogroup" aria-label="How the trajectories are related">
      <label class="relopt"><input type="radio" name="kind" value="none"><b>Separate</b><span>each on its own</span></label>
      <label class="relopt"><input type="radio" name="kind" value="agents"><b>One bug, several agents</b><span>compare the agents</span></label>
      <label class="relopt"><input type="radio" name="kind" value="runs"><b>One agent, several runs</b><span>compare the runs</span></label>
    </div>
    <div class="grpfields" id="grpFields">
      <label class="fld">Bug <input id="gBug" type="text" size="8" autocomplete="off" placeholder="id"></label>
      <label class="fld grow">Name <input id="gName" type="text" autocomplete="off"></label>
    </div>
    <div class="uftable" id="files" role="table" aria-label="Files"></div>
    <p class="relmsg" id="msg" role="alert"></p>
    <div class="upfoot">
      <button class="btn ghost" type="button" id="discard">Discard</button>
      <button class="btn primary" type="button" id="save">Open</button>
    </div>
  </section>
</main>

<div class="busy" id="busy" hidden><span class="spin" aria-hidden="true"></span><span id="busyText"></span></div>
<div id="tip" class="tip" role="tooltip" hidden></div>

<script src="data/overview.js?v=20261017e"></script>
<script src="core.js?v=20261017e"></script>
<script src="engine.js?v=20261017e"></script>
<script src="uploads.js?v=20261017e"></script>
<script src="page-upload.js?v=20261017e"></script>
</body>
</html>
